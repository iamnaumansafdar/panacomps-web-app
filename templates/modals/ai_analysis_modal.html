<style>
/* Modal styling */
.ai_modal {
    display: none; 
    position: fixed; 
    z-index: 1000; 
    left: 0;
    top: 0;
    width: 100%; 
    height: 100%; 
    overflow: auto; 
    background-color: rgba(0,0,0,0.4); /* Black w/ opacity */
}

.modal-content1 {
    background-color: #fefefe;
    margin: auto; /* Center the modal */
    padding: 20px;
    border: 1px solid #888;
    width: 80%; 
    position: relative; /* Make sure it's positioned relative for top adjustment */
    top: 20%; /* Adjust this value to control the vertical position of the modal, closer to 0 is closer to the top */
    transform: translateY(-20%); /* Center vertically */
}

.close-button {
    color: #aaa;
    float: right;
    font-size: 28px;
    font-weight: bold;
}

.close-button:hover,
.close-button:focus {
    color: black;
    text-decoration: none;
    cursor: pointer;
}

.modal-content1 {
        background-color: #fff;
        padding: 20px;
        border-radius: 10px;
        max-width: 600px;
        margin: auto;
        position: relative;
    }

    .modal-header1 {
        display: flex;
        justify-content: space-between;
        align-items: center;
    }

    .modal-buttons1 {
        display: flex;
        gap: 10px;
    }

    .styled-button1 {
        background-color: #007bff;
        color: white;
        padding: 10px 20px;
        border: none;
        border-radius: 5px;
        cursor: pointer;
        font-weight: bold;
        transition: background-color 0.3s ease;
    }

    .styled-button1:hover {
        background-color: #0056b3;
    }

    .close-button {
        position: absolute;
        top: 10px;
        right: 15px;
        font-size: 24px;
        cursor: pointer;
    }
</style>

<div id="aiAnalysisModal" class="ai_modal" style="display: none;">
    <div class="modal-content1">
        <span class="close-button">&times;</span>
        <div class="modal-header1">
            <h2>AI Analysis Results</h2>
            <div class="modal-buttons1">
                <button id="downloadAnalysis" class="styled-button1" style="display: none;">Download</button>
                <button id="resetAnalysis" class="styled-button1" style="display: none;">Reset</button>
            </div>
        </div>
        <!-- <h2>AI Analysis Results</h2> -->
        <!-- <div style="margin-top: 20px;">
            <button id="downloadAnalysis"  class="table-download-btn" style="">Download</button>
            <button id="resetAnalysis" class="table-download-btn" style="">Reset</button>
        </div> -->
        <div id="loading" style="display: none;">
            <!-- Loading spinner or loading text -->
            <p>Loading analysis, please wait...</p>
        </div>
        <div id="aiAnalysisContent" style="padding: 20px !important;">
            <!-- The AI Analysis output will be inserted here -->
            <!-- <p>Loading analysis, please wait...</p>

        </div>
        
    </div>
</div>
