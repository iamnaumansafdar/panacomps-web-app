{% extends "admin/base_site.html" %}
{% load static %}

{% block content %}
    <div class="submit-row">
        <h1>Upload CSV</h1>
        <form action="{% url 'import_csv' %}" method="post" enctype="multipart/form-data">
            {% csrf_token %}
            <input type="file" name="csv_file">
            <br><br>
            <input type="submit" value="Upload CSV">
        </form>
    </div>
{% endblock %}
